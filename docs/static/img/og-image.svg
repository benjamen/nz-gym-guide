<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="80" r="200" fill="rgba(255,255,255,0.04)"/>
  <circle cx="150" cy="550" r="150" fill="rgba(255,255,255,0.04)"/>

  <!-- Logo / icon -->
  <rect x="60" y="60" width="80" height="80" rx="16" fill="rgba(255,255,255,0.15)"/>
  <text x="100" y="115" text-anchor="middle" font-size="48" font-family="Arial">🏋️</text>

  <!-- Main headline -->
  <text x="60" y="240" font-family="Arial,sans-serif" font-size="72" font-weight="800" fill="#ffffff">NZ Gym Guide</text>
  <text x="60" y="320" font-family="Arial,sans-serif" font-size="36" fill="rgba(255,255,255,0.85)">Compare gym memberships across New Zealand</text>
  <text x="60" y="375" font-family="Arial,sans-serif" font-size="32" fill="rgba(255,255,255,0.7)">Honest prices · No sales pitch · 11 gyms · 9 cities</text>

  <!-- Stats pills -->
  <rect x="60" y="440" width="220" height="60" rx="30" fill="rgba(255,255,255,0.15)"/>
  <text x="170" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">from $7.99/wk</text>

  <rect x="300" y="440" width="200" height="60" rx="30" fill="rgba(255,255,255,0.15)"/>
  <text x="400" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">No lock-in</text>

  <rect x="520" y="440" width="220" height="60" rx="30" fill="rgba(255,255,255,0.15)"/>
  <text x="630" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">Free trial options</text>

  <!-- URL -->
  <text x="60" y="570" font-family="Arial,sans-serif" font-size="26" fill="rgba(255,255,255,0.5)">nzgymguide.co.nz</text>
</svg>
